<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
    <style>
        
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        fieldset {
            max-width: 600px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <h1>Form Registrasi</h1>

    <form action="" method="post">

        <!-- Biodata -->
        <fieldset>
            <legend>Biodata</legend>
            <table border="0" cellpadding="4">
                <tr>
                    <td><label for="nama">Nama Mahasiswa</label></td>
                    <td>:</td>
                    <td><input type="text" id="nama" name="nama" placeholder="Nama Anda"></td>
                </tr>
                <tr>
                    <td><label for="nim">No Induk Mahasiswa (NIM)</label></td>
                    <td>:</td>
                    <td><input type="text" id="nim" name="nim" value=""></td>
                </tr>
                <tr>
                    <td valign="top"><label for="alamat">Alamat Mahasiswa</label></td>
                    <td valign="top">:</td>
                    <td><textarea id="alamat" name="alamat" rows="4" cols="30" placeholder="Alamat Anda"></textarea></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>:</td>
                    <td>
                        <select name="tgl">
                            <option value="01">01</option>
                            <option value="02">02</option>
                        </select>
                        <select name="bln">
                            <option value="Januari">Januari</option>
                            <option value="Februari">Februari</option>
                        </select>
                        <select name="thn">
                            <option value="1990">1990</option>
                            <option value="1991">1991</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" id="pria" name="jk" value="Pria" checked> <label for="pria">Pria</label>
                        <input type="radio" id="wanita" name="jk" value="Wanita"> <label for="wanita">Wanita</label>
                    </td>
                </tr>
                <tr>
                    <td>Upload Foto</td>
                    <td>:</td>
                    <td><input type="file" name="foto"></td>
                </tr>
                <tr>
                    <td><label for="url">URL Website</label></td>
                    <td>:</td>
                    <td><input type="url" id="url" name="url" placeholder="URL Website Anda"></td>
                </tr>
                <tr>
                    <td><label for="pt">Perguruan Tinggi</label></td>
                    <td>:</td>
                    <td><input type="text" id="pt" name="pt"></td>
                </tr>
            </table>
        </fieldset>

        <!-- Info Akun -->
        <fieldset>
            <legend>Info Akun</legend>
            <table border="0" cellpadding="4">
                <tr>
                    <td><label for="email">Email</label></td>
                    <td>:</td>
                    <td><input type="email" id="email" name="email" placeholder="Email Anda"></td>
                </tr>
                <tr>
                    <td><label for="username">Username</label></td>
                    <td>:</td>
                    <td><input type="text" id="username" name="username" placeholder="Username Anda"></td>
                </tr>
                <tr>
                    <td><label for="password">Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="password" name="password" placeholder="Password Anda"></td>
                </tr>
                <tr>
                    <td><label for="ulang_password">Ulangi Password</label></td>
                    <td>:</td>
                    <td><input type="password" id="ulang_password" name="ulang_password" placeholder="Password Anda"></td>
                </tr>
            </table>
        </fieldset>

        <!-- Kemampuan Dasar -->
        <fieldset>
            <legend>Kemampuan Dasar</legend>
            <input type="checkbox" id="html" name="kemampuan[]" value="HTML"> <label for="html">HTML</label>
            <input type="checkbox" id="css" name="kemampuan[]" value="CSS"> <label for="css">CSS</label>
            <input type="checkbox" id="js" name="kemampuan[]" value="Javascript"> <label for="js">Javascript</label>
            <input type="checkbox" id="php" name="kemampuan[]" value="PHP"> <label for="php">PHP</label>
            <input type="checkbox" id="mysql" name="kemampuan[]" value="MySQL"> <label for="mysql">MySQL</label>
            <input type="checkbox" id="laravel" name="kemampuan[]" value="Laravel"> <label for="laravel">Laravel</label>
            <input type="checkbox" id="react" name="kemampuan[]" value="React Native"> <label for="react">React Native</label>
        </fieldset>

        <!-- Button -->
        <div>
            <input type="reset" value="Reset">
            <input type="submit" value="Simpan">
            <input type="button" value="Button">
        </div>

    </form>

</body>
</html>
